<div class="contact-container">
    <h2>Contact Us</h2>

<form method="post" id="myForm">
    <fieldset>
<legend>Your Information</legend>

<div>
    <label>Full Name : 
        <input type="text" name="t1" placeholder="Enter Full Name">
    </label><br><br>
</div>

<div>
    <label>Your Email : 
        <input type="email" name="e1" placeholder="Enter Your email">
    </label><br><br>
</div>

<div><label>Event Type :
<select> 
    <option> Weddings</option>
    <option> Birthday</option>
    <option> Graduations</option>
    <option> Small party</option>
    <option> Other...</option>
</select></label><br><br></div>

<div>
    <label>Date of Event : 
        <input type="date" name="d1" >
    </label><br><br>
</div>

<div>
    <label>Message</label>
    <textarea name="message" id="message" rows="4" placeholder="Tell us more about your event..."></textarea><br><br>
</div>

<button type="submit" class="btn">submit</button>

 </fieldset>
</form>

<script>
    const form = document.getElementById("myForm");
    form.addEventListener("submit", function (e)  {
        e.preventDefault();
        alert("form submitted!");

    });
</script>
